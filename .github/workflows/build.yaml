name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            name: Ubuntu Latest x86
          - os: macos-latest
            artifact: macos-arm64
            name: macOS Latest ARM64
          - os: windows-latest
            artifact: windows-x86_64
            name: Windows Latest x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: $/.github/actions/setup

