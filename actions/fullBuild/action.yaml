name: 'Complete build of a project'
description: 'Does all the CMake building stuff!'
inputs:
  target_name:
    description: "Name of the target in CMake"
    required: true
  keystore_base64:
    description: "Your Release keys file in base64 format for signing the application on build"
    required: false
  keystore_password:
    description: "Store password"
    required: false
  key_password:
    description: "Key password - sometimes the same as keystore_password"
    required: false
  key_alias:
    description: "Key alias"
    required: false
  release_keys_file_path:
    description: "Where to expect the release keys to be at in your project (like `resources/release-keys.jks`)"
    required: false

runs:
  using: composite
  steps: 

  # ------------------------------
  # >> Linux
  # ------------------------------

    - name: Setup Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # APT update and install of dependencies

        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          ca-certificates \
          libasound2-dev \
          libpulse-dev \
          libpipewire-0.3-dev \
          libjack-dev \
          libsndio-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxfixes-dev \
          libxi-dev \
          libxss-dev \
          libxtst-dev \
          libxinerama-dev \
          libxv-dev \
          libxxf86vm-dev \
          libxrender-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libx11-xcb-dev \
          libxcb-randr0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb-xkb-dev \
          libxcb-shm0-dev \
          libxcb-sync-dev \
          libxcb-dri3-dev \
          libwayland-dev wayland-protocols \
          libdecor-0-dev \
          libdrm-dev \
          libgbm-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libvulkan-dev \
          libdbus-1-dev \
          libibus-1.0-dev \
          libudev-dev \
          libusb-1.0-0-dev \
          libthai-dev \
          libfribidi-dev \
          liburing-dev \
          imagemagick

  # ------------------------------
  # >> macOS
  # ------------------------------

    - name: Setup macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Brew update and install of dependencies

        brew update
        brew install pkgconf ninja libusb vulkan-headers vulkan-loader molten-vk

  # ------------------------------
  # >> Windows
  # ------------------------------

    - name: Cache vcpkg artifacts
      uses: actions/cache@v6
      if: runner.os == 'Windows'
      with:
        path: |
          ${{ env.RUNNER_TEMP }}/vcpkg/installed
        key: vcpkg-${{ runner.os }}-
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Setup Windows MSVC
      uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: Setup Windows Dependencies (MSVC)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # VCPKG update and install of dependencies

        export vcpkgRoot="$RUNNER_TEMP/vcpkg"
        git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkgRoot"
        "$vcpkgRoot/bootstrap-vcpkg.sh" -disableMetrics
        "$vcpkgRoot/vcpkg" install --triplet x64-windows-static \
          bzip2 \
          libflac \
          libusb \
          vulkan \
          zlib \
          brotli \
          nghttp2 \
          libidn2 \
          freetype \
          harfbuzz \
          libpng \
          libwebp \
          tiff \
          libjpeg-turbo \
          libogg \
          libpsl[libicu] \
          libtheora \
          libvorbis \
          minimp3 \
          openal-soft \
          opus \
          opusfile

        echo "VCPKG_ROOT=$vcpkgRoot" >> $GITHUB_ENV
        choco install ninja --no-progress

  # ------------------------------
  # >> Common setup
  # ------------------------------

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install jsonschema jinja2

  # ------------------------------
  # >> Dependencies, CMake configure
  # ------------------------------

    - name: Check Android configuration
      if: runner.os == 'Linux'
      id: android
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
        KEY_PASSWORD: ${{ inputs.key_password }}
        KEY_ALIAS: ${{ inputs.key_alias }}
      run: |
        set -euo pipefail

        COUNT=0

        for VALUE in \
          "$KEYSTORE_BASE64" \
          "$KEYSTORE_PASSWORD" \
          "$KEY_PASSWORD" \
          "$KEY_ALIAS"
        do
          if [[ -n "$VALUE" ]]; then
            COUNT=$((COUNT + 1))
          fi
        done

        if [[ "$COUNT" -eq 0 ]]; then
          echo "enabled=0" >> "$GITHUB_OUTPUT"
        elif [[ "$COUNT" -eq 4 ]]; then
          echo "enabled=1" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Android signing configuration is incomplete. Provide all four credentials or none."
          exit 1
        fi

  # ------------------------------
  # >> Android setup if enabled
  # ------------------------------

    - name: Set up JDK 21 (Linux)
      uses: actions/setup-java@v6
      if: runner.os == 'Linux' && steps.android.outputs.enabled == '1'
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Android NDK (Linux)
      if: runner.os == 'Linux' && steps.android.outputs.enabled == '1'
      uses: android-actions/setup-android@v4

    - name: Install NDK and Build Tools (Linux)
      if: runner.os == 'Linux' && steps.android.outputs.enabled == '1'
      shell: bash
      run: |
        # Calls sdkmanager to install requirements
        sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;4.1.2"

    - name: Decode Release Keystore (Linux)
      if: runner.os == 'Linux' && steps.android.outputs.enabled == '1'
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
      run: |
        # Decode base64 key of the project to keys
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ${{ inputs.release_keys_file_path }}

  # ------------------------------
  # >> CMake configure
  # ------------------------------

    - name: CMake cache
      uses: actions/cache@v6
      with:
        path: build/_deps
        key: cmake-deps-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          cmake-deps-${{ runner.os }}-

    - name: CMake configure
      shell: bash
      env:
        ANDROID_ENABLED: ${{ steps.android.outputs.enabled == '1' && 'ON' || 'OFF' }}
      run: |
        set -euo pipefail

        CMAKE_ARGS=(
            -S .
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            "-DSDL3PLUS_ENABLE_ANDROID=$ANDROID_ENABLED"
        )

        VCPKG_CMAKE="${VCPKG_ROOT:-}/scripts/buildsystems/vcpkg.cmake"

        if [[ -n "${VCPKG_ROOT:-}" && -f "$VCPKG_CMAKE" ]]; then
            CMAKE_ARGS+=(
                "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE"
                "-DVCPKG_TARGET_TRIPLET=x64-windows-static"
            )
            echo "Enabled VCPKG correctly"
        else
            echo "No VCPKG config found!"
        fi

        cmake "${CMAKE_ARGS[@]}"

  # ------------------------------
  # >> CMake build
  # ------------------------------

    - name: CMake build
      shell: bash
      env:
        TARGET_NAME: ${{ inputs.target_name }}
      run: |
        # CMake build

        cmake --build build --config Release --target "$TARGET_NAME" --parallel

    - name: CMake build Android (Linux)
      if: runner.os == 'Linux' && steps.android.outputs.enabled == '1'
      shell: bash
      env:
        KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
        KEY_ALIAS: ${{ inputs.key_alias }}
        KEY_PASSWORD: ${{ inputs.key_password }}
        TARGET_NAME: ${{ inputs.target_name }}
      run: |
        # CMake build

        cmake --build build --config Release --target "${TARGET_NAME}_android_release" --parallel
        
  # ------------------------------
  # >> Upload artifacts
  # ------------------------------

    - name: Upload executable
      uses: actions/upload-artifact@v7
      if: runner.os == 'Windows'
      with:
        name: ${{ inputs.target_name }}-${{ runner.os }}
        path: |
          build/bin/${{ inputs.target_name }}.exe

    - name: Upload executable
      uses: actions/upload-artifact@v7
      if: runner.os != 'Windows'
      with:
        name: ${{ inputs.target_name }}-${{ runner.os }}
        path: |
          build/bin/${{ inputs.target_name }}

    - name: Upload APK
      if: runner.os == 'Linux' && steps.android.outputs.enabled == '1'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.target_name }}-android
        path: |
          build/bin/${{ inputs.target_name }}-android-release.apk